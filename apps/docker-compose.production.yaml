services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      APP_ENV: production
      DB_DSN: "pgsql:host=db;port=5432;dbname=${DB_NAME:-valenia}"
      DB_USER: ${DB_USER:-valenia}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Dokploy}
    expose:
      - "9000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    restart: "no"
    environment:
      APP_ENV: production
      DB_DSN: "pgsql:host=db;port=5432;dbname=${DB_NAME:-valenia}"
      DB_USER: ${DB_USER:-valenia}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Dokploy}
    command: ["php", "database/migrate.php", "up"]
    depends_on:
      db:
        condition: service_healthy

  proxy:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - app

  db:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-valenia}
      POSTGRES_USER: ${DB_USER:-valenia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Dokploy}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
