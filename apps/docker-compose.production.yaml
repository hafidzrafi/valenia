services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    image: ${VALENIA_RUNTIME_IMAGE:-valenia-runtime:latest}
    restart: unless-stopped
    environment:
      APP_ENV: production
      DB_DSN: "pgsql:host=db;port=5432;dbname=${DB_NAME:-valenia}"
      DB_USER: ${DB_USER:-valenia}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Dokploy}
    expose:
      - "9000"
    healthcheck:
      # Ask PHP-FPM for its ping response. This catches a broken pool even when
      # the TCP port is still open, and it never touches the database.
      test:
        - CMD
        - php
        - /srv/docker/healthcheck.php
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    image: ${VALENIA_RUNTIME_IMAGE:-valenia-runtime:latest}
    restart: "no"
    environment:
      APP_ENV: production
      DB_DSN: "pgsql:host=db;port=5432;dbname=${DB_NAME:-valenia}"
      DB_USER: ${DB_USER:-valenia}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Dokploy}
    command: ["php", "database/migrate.php", "up"]
    depends_on:
      db:
        condition: service_healthy

  # Optional admin bootstrap. Reference data (poli, doctors, schedules) already
  # arrives through migration 0030; this only creates/updates the admin account.
  # Not started by a normal deploy: run it explicitly with
  #   docker compose -f docker-compose.production.yaml --profile seed run --rm seed
  seed:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    image: ${VALENIA_RUNTIME_IMAGE:-valenia-runtime:latest}
    restart: "no"
    profiles: ["seed"]
    environment:
      APP_ENV: production
      DB_DSN: "pgsql:host=db;port=5432;dbname=${DB_NAME:-valenia}"
      DB_USER: ${DB_USER:-valenia}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Dokploy}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_RESET_PASSWORD: ${SEED_ADMIN_RESET_PASSWORD:-0}
    command: ["php", "database/seed.php", "--force"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  proxy:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    image: ${VALENIA_WEB_IMAGE:-valenia-web:latest}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-valenia}
      POSTGRES_USER: ${DB_USER:-valenia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Dokploy}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
