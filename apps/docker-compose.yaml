services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - .:/srv
    environment:
      APP_ENV: ${APP_ENV:-development}
      DB_DSN: ${DB_DSN:-pgsql:host=db;port=5432;dbname=valenia}
      DB_USER: ${DB_USER:-valenia}
      DB_PASSWORD: ${DB_PASSWORD:-valenia}
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: caddy:2.11.7-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/srv/public:ro
    depends_on:
      - app

  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: ${DB_NAME:-valenia}
      POSTGRES_USER: ${DB_USER:-valenia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-valenia}
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valenia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
